name: Uptime

# An hourly outside-in check of the live site: the page, the data pack the
# engine runs on, and the AI functions' health (which calls no model, so it
# costs nothing). On failure it opens an issue, or comments on the open one,
# so an outage is noticed without anyone watching a dashboard.
#
# Set the SITE_URL repository variable to check a different deployment.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ vars.SITE_URL || 'https://unbored-five.vercel.app' }}
    steps:
      - name: Probe
        id: probe
        run: |
          set -u
          fail=""
          check() {
            local name="$1" url="$2" expect="$3"
            local body code
            body=$(curl -sS -m 20 -w '\n%{http_code}' "$url" || echo -e "\n000")
            code=$(echo "$body" | tail -n1)
            if [ "$code" != "200" ] || ! echo "$body" | grep -q "$expect"; then
              echo "::error::$name failed ($url → HTTP $code)"
              fail="$fail\n- $name: HTTP $code at $url"
            else
              echo "$name ok"
            fi
          }
          check "Site" "$SITE/" '<div id="root">'
          check "Data pack manifest" "$SITE/data/manifest.json" '"files"'
          manifest=$(curl -sS -m 20 "$SITE/data/manifest.json" || true)
          cards=$(echo "$manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["files"]["cards"])' 2>/dev/null || true)
          if [ -n "$cards" ]; then check "Catalog cards" "$SITE/data/$cards" '"items"'; fi
          check "AI functions" "$SITE/api/ai/health" '"ok":true'
          if [ -n "$fail" ]; then
            { echo "report<<EOF"; echo -e "$fail"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Open or update the outage issue
        if: failure()
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const title = "Uptime check failing";
            const body = `The hourly uptime check failed at ${new Date().toISOString()}:\n${process.env.REPORT || "(see the run log)"}\n\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "uptime" });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
            }
